name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      # Every published figure still matches the results files it came from. Five figures need the models bundle,
      # which is not in git, so this run skips and names them; `--strict` before submitting covers those.
      - run: uv run python scripts/check_numbers.py
      # The teleprompter sheet is generated from docs/video.md, and it is what gets read on camera. Fail if an
      # edit to the script left the sheet behind.
      - run: uv run python scripts/teleprompter.py --check
