[project]
name = "molscreen"
version = "0.1.0"
description = "Cancer molecule-screening workbench for students (STEM2Connect AI Hackathon 2026)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm==4.7.0",
    "numpy>=2.4.6",
    "pandas==3.1.0",
    "rdkit==2026.9.1",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]
